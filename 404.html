<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chưa sẵn sàng | Enactus FTU Hanoi</title>
  <link rel="icon" href="/assets/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --yellow: #F5B700;
      --yellow-deep: #E0A400;
      --ink: #1C1D21;
      --sub: #6B6F76;
      --line: #ECE9E2;
      --cream: #FFFDF8;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }

    .container {
      width: 90%;
      max-width: 620px;
      margin: 0 auto;
      padding: 3rem 0;
    }

    /* Mark: brand logo */
    .mark {
      height: 88px;
      width: auto;
      margin-bottom: 2.25rem;
      display: block;
    }

    .eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--yellow-deep);
      margin-bottom: 0.9rem;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 1rem;
    }

    .lead {
      font-size: 1.05rem;
      color: var(--sub);
      line-height: 1.65;
      max-width: 460px;
      margin-bottom: 2.5rem;
    }

    /* Progress */
    .progress-container { margin-bottom: 2.75rem; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--sub);
      margin-bottom: 0.6rem;
    }

    .progress-label strong { color: var(--ink); font-weight: 600; }

    .progress-bar {
      height: 6px;
      background: var(--line);
      border-radius: 100px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--yellow);
      border-radius: 100px;
      transition: width 1.4s cubic-bezier(0.65, 0, 0.35, 1);
      position: relative;
      overflow: hidden;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
      animation: sweep 1.3s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .btn {
      padding: 13px 26px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
    }
    .btn-primary:hover { background: #000; }

    .btn-outline {
      border: 1.5px solid var(--line);
      color: var(--ink);
      background: transparent;
    }
    .btn-outline:hover { border-color: var(--ink); }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.75rem;
      border-top: 1px solid var(--line);
    }

    .footer-label {
      font-size: 0.8rem;
      color: var(--sub);
      letter-spacing: 0.3px;
    }

    .footer-label span { color: var(--yellow-deep); font-weight: 600; }

    .footer-icon {
      height: 24px;
      width: auto;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .lead { font-size: 1rem; }
      .actions { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
      .footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/logo_den.png" alt="Enactus FTU Hanoi" class="mark" onerror="this.style.display='none'">

    <div class="eyebrow">Đang phát triển · Enactus FTU Hanoi</div>

    <h1>Trang này<br>chưa sẵn sàng.</h1>

    <p class="lead">
      Đội kỹ thuật đang hoàn thiện trang này. Quay lại sau ít lâu nhé,
      hoặc ghé trang chủ trong lúc chờ đợi.
    </p>

    <div class="progress-container">
      <div class="progress-label">
        <span>Tiến độ xây dựng</span>
        <strong id="progressNum">0%</strong>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="actions">
      <a href="https://recruitment.enactusftuhanoi.id.vn" class="btn btn-primary">
        Về trang chủ
      </a>
      <a href="#" class="btn btn-outline" onclick="window.history.back(); return false;">
        Quay lại
      </a>
    </div>

    <div class="footer">
      <div class="footer-label">Lỗi <span>404</span> · Under construction</div>
      <img src="/assets/icon.png" alt="Enactus FTU Hanoi" class="footer-icon" onerror="this.style.display='none'">
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const target = 68;
      const fill = document.getElementById('progressFill');
      const num = document.getElementById('progressNum');
      const duration = 1400; // ms, matches CSS transition
      const start = performance.now();

      requestAnimationFrame(() => {
        fill.style.width = target + '%';
      });

      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
        num.textContent = Math.round(eased * target) + '%';
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
