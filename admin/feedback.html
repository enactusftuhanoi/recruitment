<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback - Vòng 3 | Enactus FTU Hanoi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --yellow: #F4D03F; --yellow-light: #FFF9E6; --yellow-mid: #F7C948; --yellow-deep: #E8A400;
  --bg: #F6F7FB; --white: #FFFFFF;
  --ink: #14161F; --ink-60: #63667A; --ink-30: #A8AABC; --ink-10: #EEF0F5;
  --border: #E6E8F0;
  --radius-sm: 10px; --radius: 16px; --radius-lg: 22px;
  --shadow-sm: 0 2px 8px rgba(20,22,31,.05);
  --shadow: 0 8px 24px rgba(20,22,31,.08);
  --shadow-lg: 0 20px 48px rgba(20,22,31,.16);
  --success: #10B981; --success-bg: #E7F9F1;
  --error: #EF4444; --error-bg: #FDECEC;
  --warn: #F59E0B; --warn-bg: #FEF6E7;
  --info: #4F7CFF; --info-bg: #EEF2FF;
  --t: .2s cubic-bezier(.4,0,.2,1);
  --grad-accent: linear-gradient(135deg, var(--yellow-mid) 0%, var(--yellow-deep) 100%);
  --grad-ink: linear-gradient(135deg, #23253A 0%, #14161F 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background: radial-gradient(1100px 480px at 100% -10%, rgba(244,208,63,.10), transparent 60%),
              radial-gradient(900px 420px at -10% 0%, rgba(79,124,255,.06), transparent 55%),
              var(--bg);
  background-attachment: fixed; color: var(--ink); min-height: 100vh; font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-30);border-radius:10px}

/* HEADER */
.hdr{background:rgba(255,255,255,.85);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300}
.logo{font-size:15px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.logo-img{height:30px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(20,22,31,.12))}
.nav{display:flex;gap:4px;background:var(--ink-10);padding:4px;border-radius:999px}
.nav a{padding:7px 16px;border-radius:999px;color:var(--ink-60);font-weight:600;text-decoration:none;transition:var(--t);font-size:13px}
.nav a:hover{color:var(--ink)}
.nav a.active{background:var(--grad-ink);color:var(--white);font-weight:700;box-shadow:0 4px 12px rgba(20,22,31,.25)}
.hdr-right{display:flex;align-items:center;gap:12px}
.hdr-user{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.hdr-user-name{font-size:12.5px;font-weight:700;color:var(--ink)}
.hdr-user-role{font-size:11px;color:var(--ink-60)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#3a2c00;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.logout-btn{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--ink-60);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:var(--t);display:flex;align-items:center;gap:6px}
.logout-btn:hover{background:var(--error-bg);color:var(--error);border-color:#FECACA}

.container{max-width:1360px;width:100%;margin:0 auto;padding:28px 24px 90px}
.page-title-row{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.6px}
.page-sub{font-size:13px;color:var(--ink-60);margin-top:4px;font-weight:500}
.card-title{font-size:12px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.6px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--grad-accent);box-shadow:0 0 0 4px var(--yellow-light);flex-shrink:0}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--white);color:var(--ink-60);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:var(--t);font-family:inherit}
.btn:hover{color:var(--ink);border-color:var(--ink-30)}
.btn.primary{background:var(--grad-ink);color:var(--white);border:none;box-shadow:0 4px 12px rgba(20,22,31,.18)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(20,22,31,.25)}
.btn.gold{background:var(--grad-accent);border:none;color:#3a2c00}
.btn.gold:hover{transform:translateY(-1px)}
.btn.success{background:var(--success-bg);color:var(--success);border-color:#A7EED0}
.btn.danger{background:var(--error-bg);color:var(--error);border-color:#F8C9C9}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* STATS */
.stats-section{padding:20px 22px 22px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);margin-bottom:22px}
.stats-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-pill{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.stat-pill .stat-num{font-size:22px;font-weight:800;letter-spacing:-.4px}
.stat-pill .stat-label{font-size:11px;font-weight:700;color:var(--ink-60);text-transform:uppercase;letter-spacing:.4px}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--ink-10);padding:4px;border-radius:999px;margin-bottom:22px;flex-wrap:wrap;width:fit-content}
.tab{padding:9px 18px;font-weight:700;font-size:12.5px;color:var(--ink-60);cursor:pointer;border-radius:999px;transition:var(--t);display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--grad-ink);color:var(--white);box-shadow:0 4px 12px rgba(20,22,31,.2)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* CARD */
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);margin-bottom:20px}

/* Badges */
.badge{padding:4px 12px;border-radius:20px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-error{background:var(--error-bg);color:var(--error)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:var(--ink-10);color:var(--ink-60)}

/* Table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-60);padding:10px 12px;border-bottom:1.5px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--ink-10);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
input,select,textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;font-family:inherit;background:var(--white);color:var(--ink);transition:var(--t);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yellow-deep);box-shadow:0 0 0 4px rgba(244,208,63,.2)}
textarea{resize:vertical;min-height:64px}
label.f-label{font-weight:700;font-size:11.5px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;display:block}

.controls{background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.empty-state{text-align:center;padding:44px 20px;color:var(--ink-30)}
.empty-state i{font-size:36px;margin-bottom:10px;display:block;opacity:.5}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,20,31,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:15.5px;font-weight:800}
.modal-close{cursor:pointer;color:var(--ink-30);font-size:18px}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

.sortable-ghost{opacity:.35}
.sortable-drag{opacity:.9}

/* Feedback: question cards, type badges, toggle switches */
.question-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:grab}
.question-card.dragging{opacity:.4}
.question-card.drag-over{border-color:var(--yellow-deep)}
.question-card .drag-handle{color:var(--ink-30);padding-top:2px}
.question-content{flex:1;min-width:0}
.question-label{font-weight:700;font-size:13px;margin-bottom:6px}
.question-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--ink-60)}
.type-badge{font-weight:800;padding:2px 9px;border-radius:20px;font-size:10px;text-transform:uppercase;letter-spacing:.3px;background:var(--info-bg);color:var(--info)}
.required-badge{font-weight:800;padding:2px 9px;border-radius:20px;font-size:10px;background:var(--error-bg);color:var(--error)}
.question-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:28px;height:28px;border:1px solid var(--border);background:var(--white);border-radius:8px;cursor:pointer;color:var(--ink-60);display:flex;align-items:center;justify-content:center;transition:var(--t)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-30)}
.icon-btn.delete:hover{color:var(--error);border-color:#F8C9C9;background:var(--error-bg)}
.toggle-switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--ink-10);border-radius:22px;transition:var(--t)}
.toggle-slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch input:checked + .toggle-slider{background:var(--grad-accent)}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px)}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-10)}
.setting-row:last-of-type{border-bottom:none}
.setting-title{font-weight:700;font-size:13px}
.setting-desc{font-size:11.5px;color:var(--ink-60);margin-top:2px}
.option-row{display:flex;gap:8px;margin-bottom:6px}
.feedback-item-header{cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.feedback-item-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.feedback-item-body.open{display:block}
.qa-row{margin-bottom:8px;font-size:12.5px}
.qa-question{font-weight:700;color:var(--ink-60);margin-bottom:2px}

@media (max-width:900px){.stats-summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo"><img src="/assets/logo_den.png" alt="Enactus FTU Hanoi" class="logo-img" /><span>Enactus FTU Hanoi</span></div>
  <nav class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="teamwork.html">Teamwork</a>
    <a href="feedback.html" class="active">Feedback</a>
  </nav>
  <div class="hdr-right">
    <div class="hdr-user">
      <div class="hdr-user-name" id="user-name">User</div>
      <div class="hdr-user-role" id="user-role">Role</div>
    </div>
    <div class="avatar" id="user-avatar">U</div>
    <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
  </div>
</header>

<div class="container">
  <div class="page-title-row">
    <div>
      <h1 class="page-title">Feedback - Vòng 3</h1>
      <p class="page-sub">Câu hỏi &middot; Phản hồi &middot; Quyền gửi &middot; Cài đặt</p>
    </div>
  </div>

  <div class="stats-section">
    <div class="card-title"><span class="dot"></span> Tổng quan</div>
    <div class="stats-summary" id="stats-summary"></div>
    <div class="card" id="fb-overview-info" style="margin:16px 0 0;"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-fbtab="questions"><i class="fas fa-list-check"></i> Câu hỏi</div>
    <div class="tab" data-fbtab="responses"><i class="fas fa-comment-dots"></i> Phản hồi</div>
    <div class="tab" data-fbtab="permission"><i class="fas fa-key"></i> Quyền gửi</div>
    <div class="tab" data-fbtab="settings"><i class="fas fa-gear"></i> Cài đặt</div>
  </div>

  <div id="fb-questions" class="tab-content active"></div>
  <div id="fb-responses" class="tab-content">
    <div class="controls" style="margin-bottom:16px;padding:14px 16px;">
      <input id="fb-search" placeholder="Tìm theo tên hoặc team..." style="max-width:240px;" oninput="filterFbResponses()" />
      <select id="fb-filter-team" style="max-width:200px;" onchange="filterFbResponses()"><option value="">Tất cả team</option></select>
      <button class="btn sm" style="margin-left:auto;" onclick="exportFbData()"><i class="fas fa-download"></i> Xuất Excel</button>
    </div>
    <div id="fb-responses-list"></div>
  </div>
  <div id="fb-permission" class="tab-content"></div>
  <div id="fb-settings" class="tab-content"></div>
</div>

<!-- Modal: Feedback question -->
<div class="modal-overlay" id="fbq-modal">
  <div class="modal">
    <div class="modal-head"><h3 id="fbq-modal-title">Thêm câu hỏi feedback</h3><i class="fas fa-xmark modal-close" data-close="fbq-modal"></i></div>
    <div class="modal-body">
      <input type="hidden" id="fbq-id" />
      <div><label class="f-label">Nội dung câu hỏi</label><textarea id="fbq-text" placeholder="VD: Bạn đánh giá thế nào về advisor?" rows="2"></textarea></div>
      <div><label class="f-label">Loại câu hỏi</label>
        <select id="fbq-type" onchange="handleFbqTypeChange()">
          <option value="text">Text ngắn</option>
          <option value="textarea">Text dài (đoạn văn)</option>
          <option value="radio">Chọn 1 (Radio)</option>
          <option value="checkbox">Chọn nhiều (Checkbox)</option>
          <option value="rating">Đánh giá sao (1–5)</option>
          <option value="tag">Tag thành viên</option>
        </select>
      </div>
      <div id="fbq-rating-config" style="display:none;">
        <label class="f-label">Số sao tối đa</label>
        <select id="fbq-max-rating"><option value="3">3 sao</option><option value="5" selected>5 sao</option><option value="10">10 sao</option></select>
      </div>
      <div id="fbq-options-config" style="display:none;">
        <label class="f-label">Các lựa chọn</label>
        <div id="fbq-options-list"></div>
        <button class="btn sm" type="button" onclick="addFbqOption()"><i class="fas fa-plus"></i> Thêm lựa chọn</button>
      </div>
      <div><label class="f-label">Placeholder / Hướng dẫn nhập</label><input id="fbq-placeholder" placeholder="VD: Nhập ý kiến của bạn..." /></div>
      <div id="fbq-maxlength-config"><label class="f-label">Giới hạn ký tự</label><input type="number" id="fbq-maxlength" value="500" min="50" max="5000" /></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;"><input type="checkbox" id="fbq-required" checked style="width:auto;" /> Câu hỏi bắt buộc</label>
    </div>
    <div class="modal-foot"><button class="btn" data-close="fbq-modal">Huỷ</button><button class="btn primary" id="fbq-save-btn"><i class="fas fa-check"></i> Lưu câu hỏi</button></div>
  </div>
</div>

<script src="/script/config.js"></script>
<script>
/* ============================= AUTH ============================= */
const userEmail = sessionStorage.getItem("email");
let userRole = sessionStorage.getItem("role") || null;
let userDept = sessionStorage.getItem("department") || null;

if (!userEmail || !userRole) {
  sessionStorage.setItem("postLoginRedirect", location.pathname + location.search);
  window.location.href = "login.html";
}
if (userRole === "member") window.location.href = "response.html";

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  try {
    const snap = await db.collection("account").where("email", "==", user.email).limit(1).get();
    if (snap.empty) { await auth.signOut(); window.location.href = "login.html"; return; }
    const doc = snap.docs[0];
    const data = doc.data();
    userRole = data.role || userRole;
    userDept = data.department || userDept;
    sessionStorage.setItem("role", userRole);
    sessionStorage.setItem("department", userDept);
    document.getElementById("user-name").textContent = doc.id;
    document.getElementById("user-role").textContent = `${userRole} • ${deptName(userDept)}`;
    document.getElementById("user-avatar").textContent = (doc.id || "U").charAt(0).toUpperCase();

    await loadTeamsForAccess();
    // Chỉ superadmin, admin hoặc advisor/supporter của 1 team mới được vào trang này
    if (!(userRole === "superadmin" || userRole === "admin" || isStaffOfAnyTeam(userEmail))) {
      Swal.fire({ icon: "error", title: "Không có quyền truy cập", text: "Bạn không phải advisor/supporter của team nào.", confirmButtonColor: "#E8A400" })
        .then(() => (window.location.href = "dashboard.html"));
      return;
    }
    await renderFeedbackTab();
  } catch (e) { console.error(e); }
});

document.getElementById("logout-btn").addEventListener("click", () => auth.signOut().then(() => (window.location.href = "login.html")));

function deptName(code) {
  switch (code) { case "MD": return "Truyền thông"; case "HR": return "Nhân sự"; case "PD": return "Dự án"; case "ER": return "Đối ngoại"; default: return code || ""; }
}
function isSuperOrAdmin() { return userRole === "superadmin" || userRole === "admin"; }
function isStaffOfAnyTeam(email) { return teams.some((t) => teamStaffEmails(t).includes(email)); }
function teamStaffEmails(t) {
  const arr = [];
  if (t.advisor?.email) arr.push(t.advisor.email);
  (t.supporters || []).forEach((s) => s.email && arr.push(s.email));
  return arr;
}
function canManageTeam(t) { return isSuperOrAdmin() || teamStaffEmails(t).includes(userEmail); }

/* ============================= NOTIFY ============================= */
const AppToast = Swal.mixin({ toast: true, position: "top-end", showConfirmButton: false, timer: 3000, timerProgressBar: true, customClass: { popup: "app-toast" } });
const notifySuccess = (m) => AppToast.fire({ icon: "success", title: m });
const notifyError = (m) => AppToast.fire({ icon: "error", title: m, timer: 4000 });
const notifyInfo = (m) => AppToast.fire({ icon: "info", title: m });
function confirmDialog(message, opts = {}) {
  return Swal.fire({ title: opts.title || "Xác nhận", text: message, icon: "question", showCancelButton: true, confirmButtonText: opts.confirmText || "Xác nhận", cancelButtonText: "Huỷ", confirmButtonColor: "#E8A400", cancelButtonColor: "#63667A", reverseButtons: true }).then((r) => r.isConfirmed);
}
function openModal(id) { document.getElementById(id).classList.add("show"); }
function closeModal(id) { document.getElementById(id).classList.remove("show"); }
document.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", () => closeModal(el.dataset.close)));
document.querySelectorAll(".modal-overlay").forEach((ov) => ov.addEventListener("click", (e) => { if (e.target === ov) ov.classList.remove("show"); }));

/* ============================= FEEDBACK ============================= */
const FB_QUESTIONS_DOC = db.collection("system").doc("feedback_questions");
const FB_SETTINGS_DOC = db.collection("system").doc("feedback_settings");
let fbQuestions = [];
let fbSettings = {};
let allFeedback = [];
let fbCandidates = []; // ứng viên vòng 3 (dùng cho tab Quyền gửi)
let fbFilteredResponses = [];
let fbEditingQuestionId = null;
let fbDragSrcIndex = null;

function fbGenId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function fbDefaultQuestions() {
  return [
    { id: fbGenId(), text: "Tuần teamwork của bạn diễn ra như thế nào?", type: "radio", required: true, options: ["Rất tệ", "Chưa tốt", "Bình thường", "Tốt", "Rất tốt"] },
    { id: fbGenId(), text: "Bạn cảm thấy mình phát triển được điều gì nhất?", type: "textarea", required: true, placeholder: "Chia sẻ điều bạn học được...", maxLength: 500 },
    { id: fbGenId(), text: "Đánh giá khả năng dẫn dắt của Team Lead", type: "rating", required: true, maxRating: 5 },
    { id: fbGenId(), text: "Đánh giá Advisor / Supporter của nhóm", type: "radio", required: true, options: ["Không hỗ trợ gì", "Ít hỗ trợ", "Bình thường", "Nhiệt tình", "Rất tuyệt"] },
    { id: fbGenId(), text: "Thành viên bạn thấy đáng học hỏi nhất", type: "tag", required: false, placeholder: "Gõ @ để tag thành viên" },
    { id: fbGenId(), text: "Trải lòng về vòng 3", type: "textarea", required: false, placeholder: "Chia sẻ cảm nhận...", maxLength: 1000 },
  ];
}

async function renderFeedbackTab() {
  try {
    const [qSnap, sSnap, fSnap] = await Promise.all([
      FB_QUESTIONS_DOC.get(), FB_SETTINGS_DOC.get(), db.collection("feedback").get(),
    ]);
    if (qSnap.exists && qSnap.data().questions) {
      fbQuestions = qSnap.data().questions;
    } else if (isSuperOrAdmin()) {
      fbQuestions = fbDefaultQuestions();
      await FB_QUESTIONS_DOC.set({ questions: fbQuestions, updatedAt: new Date() }, { merge: true });
    } else {
      fbQuestions = [];
    }
    fbSettings = sSnap.exists ? sSnap.data() : {};
    allFeedback = fSnap.docs.map((d) => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate ? d.data().timestamp.toDate() : (d.data().timestamp ? new Date(d.data().timestamp) : null) }));
  } catch (e) { console.error(e); }
  renderFbOverview();
  renderFbQuestions();
}

function visibleFeedbackForCurrentUser() {
  if (isSuperOrAdmin()) return allFeedback;
  // advisor/supporter chỉ đọc feedback của (các) team mình quản lý
  const myTeamNames = teams.filter((t) => canManageTeam(t)).map((t) => t.name);
  return allFeedback.filter((f) => myTeamNames.includes(f.team));
}

/* ---- TỔNG QUAN (stats + info ở đầu trang) ---- */
function renderFbOverview() {
  const fb = visibleFeedbackForCurrentUser();
  const teamCount = new Set(fb.map((f) => f.team).filter(Boolean)).size;
  const deadlineTxt = fbSettings.deadline ? new Date(fbSettings.deadline.toDate ? fbSettings.deadline.toDate() : fbSettings.deadline).toLocaleDateString("vi-VN") : "—";
  document.getElementById("stats-summary").innerHTML = `
    <div class="stat-pill"><div class="stat-num">${fbQuestions.length}</div><div class="stat-label">Số câu hỏi</div></div>
    <div class="stat-pill"><div class="stat-num">${fb.length}</div><div class="stat-label">Phản hồi đã nhận</div></div>
    <div class="stat-pill"><div class="stat-num">${teamCount}</div><div class="stat-label">Team có phản hồi</div></div>
    <div class="stat-pill"><div class="stat-num">${fbSettings.enabled ? "Bật" : "Tắt"}</div><div class="stat-label">Trạng thái gửi feedback</div></div>
    <div class="stat-pill"><div class="stat-num">${deadlineTxt}</div><div class="stat-label">Hạn gửi feedback</div></div>
  `;
  document.getElementById("fb-overview-info").innerHTML = `<p style="font-size:13px;color:var(--ink-60);">Tính năng feedback vòng 3: ứng viên (được cấp quyền) gửi nhận xét về Team Lead / Advisor / Supporter / CLB. ${isSuperOrAdmin() ? "Quản lý câu hỏi, xem phản hồi, cấp quyền gửi và cài đặt ở các tab bên dưới." : "Bạn đang xem phản hồi của (các) team mà bạn là advisor/supporter."}</p>`;
}

/* ---- QUESTIONS (chỉ superadmin/admin quản lý) ---- */
function renderFbQuestions() {
  const el = document.getElementById("fb-questions");
  const manage = isSuperOrAdmin();
  el.innerHTML = `
    <div class="card">
      <div class="card-title"><span class="dot"></span> Danh sách câu hỏi
        ${manage ? `<button class="btn sm primary" style="margin-left:auto;" onclick="openAddFbQuestion()"><i class="fas fa-plus"></i> Thêm câu hỏi</button>` : ""}
      </div>
      <div id="fbq-list"></div>
    </div>`;
  if (!manage) { document.getElementById("fbq-list").innerHTML = `<div class="empty-state"><i class="fas fa-lock"></i>Chỉ superadmin/admin quản lý câu hỏi feedback.</div>`; return; }
  buildFbQuestionList();
}
function buildFbQuestionList() {
  const list = document.getElementById("fbq-list");
  if (!fbQuestions.length) { list.innerHTML = `<div class="empty-state" style="padding:20px;"><i class="fas fa-question"></i>Chưa có câu hỏi nào.</div>`; return; }
  const typeLabels = { text: "Text ngắn", textarea: "Text dài", radio: "Chọn 1", checkbox: "Chọn nhiều", rating: "Đánh giá sao", tag: "Tag thành viên" };
  list.innerHTML = fbQuestions.map((q, i) => `
    <div class="question-card" draggable="true" data-index="${i}">
      <div class="drag-handle"><i class="fas fa-grip-vertical"></i></div>
      <div class="question-content">
        <div class="question-label"><span style="color:var(--ink-30);font-size:12px;font-weight:600;">Q${i + 1}.</span> ${q.text}</div>
        <div class="question-meta">
          <span class="type-badge">${typeLabels[q.type] || q.type}</span>
          ${q.required ? '<span class="required-badge">Bắt buộc</span>' : ""}
          ${q.options?.length ? `<span>• ${q.options.slice(0, 3).join(" / ")}${q.options.length > 3 ? " ..." : ""}</span>` : ""}
          ${q.maxRating ? `<span>• Max: ${q.maxRating} sao</span>` : ""}
          ${q.maxLength ? `<span>• Tối đa ${q.maxLength} ký tự</span>` : ""}
        </div>
      </div>
      <div class="question-actions">
        <button class="icon-btn" onclick="openEditFbQuestion('${q.id}')" title="Sửa"><i class="fas fa-pencil"></i></button>
        <button class="icon-btn delete" onclick="removeFbQuestion('${q.id}')" title="Xóa"><i class="fas fa-trash"></i></button>
      </div>
    </div>`).join("");
  document.querySelectorAll("#fbq-list .question-card").forEach((card) => {
    card.addEventListener("dragstart", (e) => { fbDragSrcIndex = parseInt(card.dataset.index); card.classList.add("dragging"); });
    card.addEventListener("dragend", () => card.classList.remove("dragging"));
    card.addEventListener("dragover", (e) => { e.preventDefault(); card.classList.add("drag-over"); });
    card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
    card.addEventListener("drop", async (e) => {
      e.preventDefault(); card.classList.remove("drag-over");
      const targetIndex = parseInt(card.dataset.index);
      if (fbDragSrcIndex !== null && fbDragSrcIndex !== targetIndex) {
        const moved = fbQuestions.splice(fbDragSrcIndex, 1)[0];
        fbQuestions.splice(targetIndex, 0, moved);
        await FB_QUESTIONS_DOC.set({ questions: fbQuestions, updatedAt: new Date() }, { merge: true });
        buildFbQuestionList();
      }
    });
  });
}
window.handleFbqTypeChange = () => {
  const type = document.getElementById("fbq-type").value;
  document.getElementById("fbq-options-config").style.display = ["radio", "checkbox"].includes(type) ? "block" : "none";
  document.getElementById("fbq-rating-config").style.display = type === "rating" ? "block" : "none";
  document.getElementById("fbq-maxlength-config").style.display = ["text", "textarea"].includes(type) ? "block" : "none";
};
window.addFbqOption = (val = "") => {
  const row = document.createElement("div");
  row.className = "option-row";
  row.innerHTML = `<input type="text" value="${val}" placeholder="Nhập lựa chọn..." /><button class="icon-btn delete" type="button" onclick="this.parentNode.remove()"><i class="fas fa-times"></i></button>`;
  document.getElementById("fbq-options-list").appendChild(row);
};
window.openAddFbQuestion = () => {
  fbEditingQuestionId = null;
  document.getElementById("fbq-modal-title").textContent = "Thêm câu hỏi mới";
  document.getElementById("fbq-id").value = "";
  document.getElementById("fbq-text").value = "";
  document.getElementById("fbq-type").value = "text";
  document.getElementById("fbq-placeholder").value = "";
  document.getElementById("fbq-maxlength").value = "500";
  document.getElementById("fbq-required").checked = true;
  document.getElementById("fbq-max-rating").value = "5";
  document.getElementById("fbq-options-list").innerHTML = "";
  handleFbqTypeChange();
  openModal("fbq-modal");
};
window.openEditFbQuestion = (qId) => {
  const q = fbQuestions.find((x) => x.id === qId);
  if (!q) return;
  fbEditingQuestionId = qId;
  document.getElementById("fbq-modal-title").textContent = "Chỉnh sửa câu hỏi";
  document.getElementById("fbq-id").value = qId;
  document.getElementById("fbq-text").value = q.text || "";
  document.getElementById("fbq-type").value = q.type || "text";
  document.getElementById("fbq-placeholder").value = q.placeholder || "";
  document.getElementById("fbq-maxlength").value = q.maxLength || 500;
  document.getElementById("fbq-required").checked = q.required !== false;
  document.getElementById("fbq-max-rating").value = q.maxRating || 5;
  document.getElementById("fbq-options-list").innerHTML = "";
  (q.options || []).forEach((opt) => window.addFbqOption(opt));
  handleFbqTypeChange();
  openModal("fbq-modal");
};
document.getElementById("fbq-save-btn").addEventListener("click", async () => {
  const text = document.getElementById("fbq-text").value.trim();
  if (!text) return notifyError("Vui lòng nhập nội dung câu hỏi");
  const type = document.getElementById("fbq-type").value;
  const q = { id: fbEditingQuestionId || fbGenId(), text, type, required: document.getElementById("fbq-required").checked, placeholder: document.getElementById("fbq-placeholder").value.trim() };
  if (["text", "textarea"].includes(type)) q.maxLength = parseInt(document.getElementById("fbq-maxlength").value) || 500;
  if (type === "rating") q.maxRating = parseInt(document.getElementById("fbq-max-rating").value) || 5;
  if (["radio", "checkbox"].includes(type)) {
    q.options = Array.from(document.querySelectorAll("#fbq-options-list .option-row input")).map((i) => i.value.trim()).filter(Boolean);
    if (!q.options.length) return notifyError("Vui lòng thêm ít nhất 1 lựa chọn");
  }
  if (fbEditingQuestionId) {
    const idx = fbQuestions.findIndex((x) => x.id === fbEditingQuestionId);
    if (idx >= 0) fbQuestions[idx] = q;
  } else {
    fbQuestions.push(q);
  }
  await FB_QUESTIONS_DOC.set({ questions: fbQuestions, updatedAt: new Date() }, { merge: true });
  notifySuccess("Đã lưu câu hỏi");
  closeModal("fbq-modal");
  buildFbQuestionList();
  renderFbOverview();
});
window.removeFbQuestion = async (qId) => {
  const ok = await confirmDialog("Xoá câu hỏi này? Dữ liệu câu trả lời tương ứng sẽ không bị xóa.", { confirmText: "Xoá" });
  if (!ok) return;
  fbQuestions = fbQuestions.filter((q) => q.id !== qId);
  await FB_QUESTIONS_DOC.set({ questions: fbQuestions, updatedAt: new Date() }, { merge: true });
  buildFbQuestionList();
  renderFbOverview();
};

/* ---- RESPONSES ---- */
function renderFbResponses() {
  const fb = visibleFeedbackForCurrentUser();
  const teamSel = document.getElementById("fb-filter-team");
  const teamNames = [...new Set(fb.map((f) => f.team).filter(Boolean))].sort();
  teamSel.innerHTML = `<option value="">Tất cả team</option>` + teamNames.map((t) => `<option value="${t}">${t}</option>`).join("");
  document.getElementById("fb-search").value = "";
  fbFilteredResponses = fb;
  displayFbResponses();
}
window.filterFbResponses = () => {
  const search = document.getElementById("fb-search").value.toLowerCase();
  const team = document.getElementById("fb-filter-team").value;
  const fb = visibleFeedbackForCurrentUser();
  fbFilteredResponses = fb.filter((f) => {
    const matchTeam = !team || f.team === team;
    const matchSearch = !search || (f.applicantName || "").toLowerCase().includes(search) || (f.team || "").toLowerCase().includes(search);
    return matchTeam && matchSearch;
  });
  displayFbResponses();
};
function displayFbResponses() {
  const container = document.getElementById("fb-responses-list");
  container.innerHTML = `<div class="card"><div class="card-title"><span class="dot"></span> Phản hồi (${fbFilteredResponses.length})</div><div id="fb-resp-inner"></div></div>`;
  const inner = document.getElementById("fb-resp-inner");
  if (!fbFilteredResponses.length) { inner.innerHTML = `<div class="empty-state"><i class="fas fa-comment"></i>Không có phản hồi nào.</div>`; return; }
  inner.innerHTML = fbFilteredResponses.map((f) => buildFbFeedbackItem(f)).join("");
  inner.querySelectorAll(".feedback-item-header").forEach((h) => h.addEventListener("click", () => h.nextElementSibling.classList.toggle("open")));
}
function buildFbFeedbackItem(f) {
  const time = f.timestamp instanceof Date ? f.timestamp.toLocaleString("vi-VN") : "";
  const answers = fbQuestions.map((q) => {
    const ans = f.answers?.[q.id];
    if (ans === undefined || ans === null || ans === "") return "";
    let display = "";
    if (Array.isArray(ans)) display = ans.map((a) => (typeof a === "object" ? a.name : a)).join(", ");
    else if (typeof ans === "object") display = ans.name || JSON.stringify(ans);
    else display = String(ans);
    return `<div class="qa-row"><div class="qa-question">${q.text}</div><div class="qa-answer">${display}</div></div>`;
  }).filter(Boolean).join("");
  return `
  <div class="sub-item" style="flex-direction:column;align-items:stretch;">
    <div class="feedback-item-header">
      <div><b>${f.applicantName || "Ứng viên"}</b><div style="font-size:11.5px;color:var(--ink-60);">Team: ${f.team || "—"} &bull; ${time}</div></div>
      <i class="fas fa-chevron-down" style="color:var(--ink-30);"></i>
    </div>
    <div class="feedback-item-body">${answers || '<p style="color:var(--ink-30);font-size:12px;">Không có dữ liệu</p>'}</div>
  </div>`;
}
window.exportFbData = () => {
  const fb = fbFilteredResponses.length ? fbFilteredResponses : visibleFeedbackForCurrentUser();
  if (!fb.length) return notifyInfo("Không có dữ liệu để xuất");
  const headers = ["STT", "Họ tên", "Email", "Team", "Thời gian", ...fbQuestions.map((q) => q.text)];
  const rows = fb.map((f, i) => {
    const answerCols = fbQuestions.map((q) => {
      const ans = f.answers?.[q.id];
      if (!ans) return "";
      if (Array.isArray(ans)) return ans.map((a) => (typeof a === "object" ? a.name : a)).join(", ");
      return String(ans);
    });
    return [i + 1, f.applicantName || "", f.applicantEmail || "", f.team || "", f.timestamp instanceof Date ? f.timestamp.toLocaleString("vi-VN") : "", ...answerCols];
  });
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Feedback");
  XLSX.writeFile(wb, `Feedback_VongIII_${new Date().toISOString().split("T")[0]}.xlsx`);
};

/* ---- PERMISSION (chỉ superadmin/admin) ---- */
async function renderFbPermission() {
  const el = document.getElementById("fb-permission");
  if (!isSuperOrAdmin()) { el.innerHTML = `<div class="empty-state"><i class="fas fa-lock"></i>Chỉ superadmin/admin quản lý quyền gửi feedback.</div>`; return; }
  el.innerHTML = `
    <div class="card">
      <div class="card-title"><span class="dot"></span> Cấp quyền gửi feedback cho ứng viên
        <div style="margin-left:auto;display:flex;gap:8px;">
          <input id="fb-perm-search" placeholder="Tìm tên / email / team..." style="width:200px;" oninput="filterFbPermission(this.value)" />
          <button class="btn sm success" onclick="grantAllFbPermission()"><i class="fas fa-check-double"></i> Cấp tất cả</button>
          <button class="btn sm danger" onclick="revokeAllFbPermission()"><i class="fas fa-ban"></i> Thu hồi tất cả</button>
        </div>
      </div>
      <table><thead><tr><th>Họ tên</th><th>Email</th><th>Team</th><th>Quyền gửi</th><th>Đã gửi</th><th></th></tr></thead><tbody id="fb-perm-tbody"></tbody></table>
    </div>`;
  const snap = await db.collection("applications").where("current_round", "==", "round3").get();
  fbCandidates = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  buildFbPermissionTable(fbCandidates);
}
function buildFbPermissionTable(data) {
  const tbody = document.getElementById("fb-perm-tbody");
  if (!tbody) return;
  tbody.innerHTML = data.length ? data.map((c) => {
    const hasFeedback = allFeedback.some((f) => f.applicantEmail === c.email);
    return `<tr>
      <td>${c.fullname || c.fullName || c.full_name || c.id}</td><td>${c.email || "—"}</td><td>${c.round3?.team || "—"}</td>
      <td>${c.feedback_permission ? '<span class="badge badge-success">Đã cấp</span>' : '<span class="badge badge-warn">Chưa cấp</span>'}</td>
      <td>${hasFeedback ? '<span class="badge badge-info">Đã gửi</span>' : '<span class="badge badge-neutral">Chưa gửi</span>'}</td>
      <td><button class="btn sm" onclick="toggleFbPermission('${c.id}', ${!c.feedback_permission})">${c.feedback_permission ? "Thu hồi" : "Cấp quyền"}</button></td>
    </tr>`;
  }).join("") : `<tr><td colspan="6" class="empty-state">Không có ứng viên vòng 3.</td></tr>`;
}
window.filterFbPermission = (term) => {
  const t = term.toLowerCase();
  buildFbPermissionTable(fbCandidates.filter((c) => (c.fullname || c.fullName || c.full_name || "").toLowerCase().includes(t) || (c.email || "").toLowerCase().includes(t) || (c.round3?.team || "").toLowerCase().includes(t)));
};
window.toggleFbPermission = async (appId, grant) => {
  const updates = { feedback_permission: grant };
  if (grant) { updates.feedback_permission_granted_at = new Date(); updates.feedback_permission_granted_by = userEmail; }
  else updates.feedback_permission = firebase.firestore.FieldValue.delete();
  await db.collection("applications").doc(appId).update(updates);
  notifySuccess(grant ? "Đã cấp quyền" : "Đã thu hồi quyền");
  await renderFbPermission();
};
window.grantAllFbPermission = async () => {
  const targets = fbCandidates.filter((c) => !c.feedback_permission);
  if (!targets.length) return notifyInfo("Tất cả đã được cấp quyền.");
  const ok = await confirmDialog(`Cấp quyền gửi feedback cho ${targets.length} ứng viên chưa được cấp?`);
  if (!ok) return;
  const batch = db.batch();
  targets.forEach((c) => batch.update(db.collection("applications").doc(c.id), { feedback_permission: true, feedback_permission_granted_at: new Date() }));
  await batch.commit();
  notifySuccess("Đã cấp quyền cho tất cả");
  await renderFbPermission();
};
window.revokeAllFbPermission = async () => {
  const targets = fbCandidates.filter((c) => c.feedback_permission);
  if (!targets.length) return notifyInfo("Chưa có ai được cấp quyền.");
  const ok = await confirmDialog("Thu hồi quyền gửi feedback của tất cả ứng viên?", { confirmText: "Thu hồi" });
  if (!ok) return;
  const batch = db.batch();
  targets.forEach((c) => batch.update(db.collection("applications").doc(c.id), { feedback_permission: firebase.firestore.FieldValue.delete() }));
  await batch.commit();
  notifySuccess("Đã thu hồi quyền của tất cả");
  await renderFbPermission();
};

        <label class="toggle-switch"><input type="checkbox" id="fb-toggle-enabled" ${fbSettings.enabled ? "checked" : ""} onchange="saveFbSettings()" /><span class="toggle-slider"></span></label>

      <div class="setting-row">
        <div><div class="setting-title">Cho phép xem lại câu trả lời</div><div class="setting-desc">Ứng viên có thể xem lại feedback của mình sau khi gửi</div></div>
        <label class="toggle-switch"><input type="checkbox" id="fb-toggle-view-own" ${fbSettings.allowViewOwn ? "checked" : ""} onchange="saveFbSettings()" /><span class="toggle-slider"></span></label>
      </div>
      <div class="setting-row">
        <div><div class="setting-title">Cho phép sửa sau khi gửi</div><div class="setting-desc">Ứng viên có thể chỉnh sửa feedback đã gửi</div></div>
        <label class="toggle-switch"><input type="checkbox" id="fb-toggle-allow-edit" ${fbSettings.allowEdit ? "checked" : ""} onchange="saveFbSettings()" /><span class="toggle-slider"></span></label>
      </div>
      <div class="setting-row">
        <div style="flex:1;"><div class="setting-title">Hạn gửi feedback</div><input type="datetime-local" id="fb-deadline-input" value="${deadlineVal}" style="max-width:260px;margin-top:8px;" /></div>
        <button class="btn primary" onclick="saveFbDeadline()"><i class="fas fa-check"></i> Lưu hạn</button>
      </div>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
        <div class="card-title">Nguy hiểm</div>
        <button class="btn danger" onclick="deleteAllFbFeedback()"><i class="fas fa-trash"></i> Xoá toàn bộ feedback</button>
      </div>
    </div>`;
}
window.saveFbSettings = async () => {
  const updates = {
    enabled: document.getElementById("fb-toggle-enabled").checked,
    allowViewOwn: document.getElementById("fb-toggle-view-own").checked,
    allowEdit: document.getElementById("fb-toggle-allow-edit").checked,
    updatedAt: new Date(),
  };
  await FB_SETTINGS_DOC.set(updates, { merge: true });
  Object.assign(fbSettings, updates);
  notifySuccess("Đã lưu cài đặt feedback");
  renderFbOverview();
};
window.saveFbDeadline = async () => {
  const val = document.getElementById("fb-deadline-input").value;
  if (!val) return notifyError("Vui lòng chọn hạn gửi");
  const deadline = new Date(val);
  await FB_SETTINGS_DOC.set({ deadline, updatedAt: new Date() }, { merge: true });
  fbSettings.deadline = deadline;
  notifySuccess("Đã lưu hạn: " + deadline.toLocaleString("vi-VN"));
  renderFbOverview();
};
window.deleteAllFbFeedback = async () => {
  const ok1 = await confirmDialog("Xoá TOÀN BỘ feedback? Hành động không thể hoàn tác!", { confirmText: "Xoá hết" });
  if (!ok1) return;
  const ok2 = await confirmDialog("Xác nhận lần 2: Xoá toàn bộ?", { confirmText: "Xoá vĩnh viễn" });
  if (!ok2) return;
  const snap = await db.collection("feedback").get();
  const batch = db.batch();
  snap.docs.forEach((d) => batch.delete(d.ref));
  await batch.commit();
  allFeedback = [];
  notifySuccess("Đã xoá toàn bộ feedback");
  renderFbOverview();
};
</script>
</body>
</html>
