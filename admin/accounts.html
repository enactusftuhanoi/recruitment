<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị tài khoản | Enactus FTU Hanoi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #eef2ff;
            --primary-soft: #e0e7ff;
            --accent: #d4a017;
            --gray-50: #f8f9fb;
            --gray-100: #f1f2f5;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --error: #ef4444;
            --error-light: #fee2e2;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --border-radius: 12px;
            --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 1px 3px rgba(17,24,39,0.06);
            --shadow-md: 0 4px 6px -2px rgba(17,24,39,0.05), 0 10px 15px -3px rgba(17,24,39,0.08);
            --shadow-lg: 0 10px 25px -5px rgba(17,24,39,0.12), 0 8px 10px -6px rgba(17,24,39,0.08);
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: linear-gradient(180deg, var(--gray-50) 0%, #eef0f5 100%);
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        /* ======================== TOPBAR ======================== */
        .topbar {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gray-200);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .topbar-logo img {
            height: 40px;
        }

        .topbar-divider {
            width: 1px;
            height: 32px;
            background: var(--gray-200);
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            font-family: inherit;
        }
        .btn:active { transform: translateY(1px); }

        .btn-ghost {
            background: var(--white);
            color: var(--gray-700);
            border-color: var(--gray-200);
        }
        .btn-ghost:hover { background: var(--gray-100); border-color: var(--gray-300); }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 1px 2px rgba(79,70,229,0.35);
        }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-danger {
            background: var(--white);
            color: var(--error);
            border-color: var(--error-light);
        }
        .btn-danger:hover { background: var(--error); color: var(--white); border-color: var(--error); }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        /* ======================== CONTAINER ======================== */
        .container {
            width: 100%;
            max-width: 1200px;
            margin-top: 80px;
        }

        /* ======================== PAGE HEADER ======================== */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--gray-900);
        }

        .page-header p {
            color: var(--gray-500);
            font-size: 14px;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ======================== TOOLBAR (tìm kiếm + bộ lọc) ======================== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            position: relative;
            flex: 1 1 220px;
            min-width: 200px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 13px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 34px;
            border: 1px solid var(--gray-300);
            border-radius: var(--border-radius);
            font-size: 13px;
            font-family: inherit;
            color: var(--gray-800);
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(248, 243, 206, 0.3);
        }

        .toolbar-select {
            width: auto;
            min-width: 150px;
            padding: 9px 12px;
            font-size: 13px;
        }

        /* ======================== BULK ACTIONS BAR ======================== */
        .bulk-bar {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            margin-bottom: 16px;
            background: var(--info-light);
            border: 1px solid var(--info);
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-800);
        }

        /* ======================== CARD ======================== */
        .card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        /* ======================== TABLE ======================== */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: var(--gray-50);
            padding: 12px 16px;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--gray-500);
            border-bottom: 1px solid var(--gray-200);
            white-space: nowrap;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-700);
        }

        tbody tr:last-child td { border-bottom: none; }

        tr {
            transition: var(--transition);
        }

        tr:hover td {
            background: var(--primary-light);
        }

        /* ======================== BADGE ======================== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .badge-superadmin { background: var(--warning-light); color: #b45309; }
        .badge-admin { background: var(--info-light); color: #1d4ed8; }
        .badge-member { background: var(--gray-100); color: var(--gray-600); }

        /* ======================== MODAL ======================== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--white);
            border-radius: 16px;
            width: 90%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modal-pop 0.18s ease;
        }

        @keyframes modal-pop {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ======================== TOAST ======================== */
        .toast-stack {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 340px;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-left: 4px solid var(--info);
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: var(--shadow-lg);
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-800);
            animation: toast-in 0.25s ease;
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--error); }
        .toast.warning { border-left-color: var(--warning); }

        .toast i.toast-icon { font-size: 15px; margin-top: 1px; }
        .toast.success i.toast-icon { color: var(--success); }
        .toast.error i.toast-icon { color: var(--error); }
        .toast.warning i.toast-icon { color: var(--warning); }
        .toast.info i.toast-icon { color: var(--info); }

        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 13px;
            padding: 2px;
            line-height: 1;
        }
        .toast-close:hover { color: var(--gray-700); }

        .toast.leaving { animation: toast-out 0.2s ease forwards; }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(16px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes toast-out {
            to { opacity: 0; transform: translateX(16px); }
        }

        /* ======================== CONFIRM DIALOG ======================== */
        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(17,24,39,0.5);
            z-index: 2100;
            align-items: center;
            justify-content: center;
        }
        .confirm-overlay.active { display: flex; }

        .confirm-box {
            background: var(--white);
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: modal-pop 0.18s ease;
        }

        .confirm-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 20px;
            background: var(--error-light);
            color: var(--error);
        }
        .confirm-icon.neutral { background: var(--primary-light); color: var(--primary); }

        .confirm-message {
            font-size: 14px;
            color: var(--gray-700);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .confirm-actions .btn { flex: 1; justify-content: center; }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--gray-500);
        }

        .modal-body { padding: 24px; }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* ======================== FORM ======================== */
        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--gray-700);
            margin-bottom: 6px;
        }
        .form-label .required { color: var(--error); margin-left: 2px; }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--border-radius);
            font-size: 14px;
            color: var(--gray-800);
            background: var(--white);
            transition: var(--transition);
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(248, 243, 206, 0.3);
        }

        .form-textarea { resize: vertical; min-height: 80px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* ======================== RESPONSIVE ======================== */
        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: flex-start; }
            .form-row { grid-template-columns: 1fr; }
            .topbar-title { display: none; }
        }
    </style>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <a href="dashboard.html" class="topbar-logo">
            <img src="/assets/logo_den.png" alt="Enactus FTU Hanoi">
        </a>
        <div class="topbar-divider"></div>
        <span class="topbar-title">Quản trị tài khoản</span>
    </div>
    <div class="topbar-right">
        <button class="btn btn-ghost" onclick="window.location.href='dashboard.html'">
            <i class="fas fa-arrow-left"></i> Dashboard
        </button>
        <button class="btn btn-danger" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </button>
    </div>
</div>

<!-- CONTENT -->
<div class="container">
    <div class="page-header">
        <div>
            <h1><i class="fas fa-shield-halved" style="color: var(--warning);"></i> Quản trị tài khoản</h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="showAddAccountForm()">
                <i class="fas fa-plus"></i> Thêm tài khoản
            </button>
            <button class="btn btn-ghost" onclick="loadAccounts()">
                <i class="fas fa-sync-alt"></i> Làm mới
            </button>
        </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Tìm theo tên hoặc email..." oninput="applyFilters()">
            </div>
            <select class="form-select toolbar-select" id="filter-role" onchange="applyFilters()">
                <option value="">Tất cả role</option>
                <option value="superadmin">Super Admin</option>
                <option value="admin">Admin</option>
                <option value="member">Member</option>
            </select>
            <select class="form-select toolbar-select" id="filter-department" onchange="applyFilters()">
                <option value="">Tất cả ban</option>
                <option value="HR">Nhân sự</option>
                <option value="MD">Truyền thông</option>
                <option value="ER">Đối ngoại</option>
                <option value="PD">Dự án</option>
            </select>
            <select class="form-select toolbar-select" id="filter-notification" onchange="applyFilters()">
                <option value="">Nhận thông báo: Tất cả</option>
                <option value="yes">Có nhận</option>
                <option value="no">Không nhận</option>
            </select>
            <button class="btn btn-ghost btn-sm" onclick="resetFilters()">
                <i class="fas fa-rotate-left"></i> Xóa lọc
            </button>
        </div>
    </div>

    <div class="card">
        <div class="bulk-bar" id="bulk-bar">
            <span id="bulk-count">0 đã chọn</span>
            <div style="margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <select class="form-select toolbar-select" id="bulk-role-select" style="width:auto;">
                    <option value="">Đổi role...</option>
                    <option value="superadmin">Superadmin</option>
                    <option value="admin">Admin</option>
                    <option value="member">Member</option>
                </select>
                <button class="btn btn-ghost btn-sm" onclick="bulkChangeRole()">Áp dụng</button>

                <select class="form-select toolbar-select" id="bulk-department-select" style="width:auto;">
                    <option value="">Đổi ban...</option>
                    <option value="HR">Nhân sự</option>
                    <option value="MD">Truyền thông</option>
                    <option value="ER">Đối ngoại</option>
                    <option value="PD">Dự án</option>
                </select>
                <button class="btn btn-ghost btn-sm" onclick="bulkChangeDepartment()">Áp dụng</button>

                <button class="btn btn-ghost btn-sm" onclick="bulkToggleNotification(true)">
                    <i class="fas fa-bell"></i> Bật thông báo
                </button>
                <button class="btn btn-ghost btn-sm" onclick="bulkToggleNotification(false)">
                    <i class="fas fa-bell-slash"></i> Tắt thông báo
                </button>

                <button class="btn btn-ghost btn-sm" onclick="clearSelection()">Bỏ chọn</button>
                <button class="btn btn-danger btn-sm" onclick="bulkDeleteAccounts()">
                    <i class="fas fa-trash"></i> Xóa đã chọn
                </button>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:36px;"><input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this.checked)"></th>
                        <th>Họ tên (ID)</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Nhận thông báo</th>
                        <th>Note</th>
                        <th style="width:120px;">Hành động</th>
                    </tr>
                </thead>
                <tbody id="accounts-table-body">
                    <tr>
                        <td colspan="8" style="text-align:center;padding:40px;color:var(--gray-400);">
                            <i class="fas fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                            Đang tải danh sách...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL: Thêm/Sửa tài khoản -->
<div class="modal-overlay" id="account-form-modal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="form-modal-title">Thêm tài khoản mới</div>
            <button class="modal-close" onclick="closeForm()">&times;</button>
        </div>
        <form id="account-form">
            <div class="modal-body">
                <input type="hidden" id="account-id">

                <div class="form-group">
                    <label class="form-label">Họ và tên <span class="required">*</span></label>
                    <input type="text" class="form-input" id="account-name" placeholder="Nhập họ tên" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email <span class="required">*</span></label>
                    <input type="email" class="form-input" id="account-email" placeholder="example@email.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Role <span class="required">*</span></label>
                        <select class="form-select" id="account-role">
                            <option value="superadmin">Super Admin</option>
                            <option value="admin">Admin</option>
                            <option value="member">Member</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <select class="form-select" id="account-department">
                            <option value="">-- Chọn ban --</option>
                            <option value="HR">Nhân sự</option>
                            <option value="MD">Truyền thông</option>
                            <option value="ER">Đối ngoại</option>
                            <option value="PD">Dự án</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                        <input type="checkbox" id="account-notification" checked>
                        <span>Nhận thông báo đơn mới</span>
                    </label>
                    <div style="font-size:12px;color:var(--gray-500);margin-top:4px;margin-left:28px;">
                        Khi bật, tài khoản này sẽ nhận email thông báo khi có ứng viên mới
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Note</label>
                    <textarea class="form-textarea" id="account-note" placeholder="Ghi chú thêm..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeForm()">Hủy</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Lưu tài khoản
                </button>
            </div>
        </form>
    </div>
</div>


<!-- TOAST STACK (thay cho alert của trình duyệt) -->
<div class="toast-stack" id="toast-stack"></div>

<!-- CONFIRM DIALOG (thay cho confirm của trình duyệt) -->
<div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
        <div class="confirm-icon" id="confirm-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <div class="confirm-message" id="confirm-message"></div>
        <div class="confirm-actions">
            <button type="button" class="btn btn-ghost" id="confirm-cancel-btn">Hủy</button>
            <button type="button" class="btn btn-danger" id="confirm-ok-btn" style="background:var(--error);color:var(--white);">Xác nhận</button>
        </div>
    </div>
</div>

<script src="/script/config.js"></script>
<script>
// ===== Toast (thay cho alert) =====
function showToast(message, type = "info", duration = 3500) {
  const stack = document.getElementById("toast-stack");
  if (!stack) { console.log(message); return; }

  const icons = {
    success: "fa-circle-check",
    error: "fa-circle-exclamation",
    warning: "fa-triangle-exclamation",
    info: "fa-circle-info"
  };

  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <i class="fas ${icons[type] || icons.info} toast-icon"></i>
    <span>${message}</span>
    <button class="toast-close" aria-label="Đóng">&times;</button>
  `;

  const remove = () => {
    toast.classList.add("leaving");
    setTimeout(() => toast.remove(), 200);
  };

  toast.querySelector(".toast-close").addEventListener("click", remove);
  stack.appendChild(toast);
  setTimeout(remove, duration);
}

// ===== Confirm dialog (thay cho confirm) =====
function confirmDialog(message, { danger = true } = {}) {
  return new Promise(resolve => {
    const overlay = document.getElementById("confirm-overlay");
    const msgEl = document.getElementById("confirm-message");
    const iconEl = document.getElementById("confirm-icon");
    const okBtn = document.getElementById("confirm-ok-btn");
    const cancelBtn = document.getElementById("confirm-cancel-btn");

    msgEl.textContent = message;
    iconEl.className = danger ? "confirm-icon" : "confirm-icon neutral";
    iconEl.innerHTML = danger ? '<i class="fas fa-triangle-exclamation"></i>' : '<i class="fas fa-circle-question"></i>';
    okBtn.style.background = danger ? "var(--error)" : "var(--primary)";
    okBtn.style.color = "var(--white)";

    overlay.classList.add("active");

    const cleanup = (result) => {
      overlay.classList.remove("active");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onOverlay);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onOverlay = (e) => { if (e.target === overlay) cleanup(false); };

    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    overlay.addEventListener("click", onOverlay);
  });
}

// ===== State =====
let allAccounts = [];
let selectedIds = new Set();

// ===== Load danh sách account =====
async function loadAccounts() {
  const tbody = document.getElementById("accounts-table-body");
  tbody.innerHTML = `
    <tr>
      <td colspan="8" style="text-align:center;padding:40px;color:var(--gray-400);">
        <i class="fas fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:8px;"></i>
        Đang tải danh sách...
      </td>
    </tr>
  `;

  try {
    const snapshot = await db.collection("account").get();
    allAccounts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    selectedIds.clear();
    applyFilters();
  } catch (err) {
    console.error("Lỗi load accounts:", err);
    tbody.innerHTML = `
      <tr>
        <td colspan="8" style="text-align:center;padding:40px;color:var(--error);">
          <i class="fas fa-exclamation-triangle" style="font-size:24px;display:block;margin-bottom:8px;"></i>
          Không thể tải danh sách tài khoản!
        </td>
      </tr>
    `;
  }
}

// ===== Tìm kiếm + Bộ lọc =====
function applyFilters() {
  const searchText = (document.getElementById("search-input")?.value || "").trim().toLowerCase();
  const roleFilter = document.getElementById("filter-role")?.value || "";
  const deptFilter = document.getElementById("filter-department")?.value || "";
  const notiFilter = document.getElementById("filter-notification")?.value || "";

  const filtered = allAccounts.filter(acc => {
    if (searchText) {
      const haystack = `${acc.id || ""} ${acc.email || ""}`.toLowerCase();
      if (!haystack.includes(searchText)) return false;
    }
    if (roleFilter && acc.role !== roleFilter) return false;
    if (deptFilter && acc.department !== deptFilter) return false;
    if (notiFilter) {
      const canReceive = acc.canReceiveNotification !== false;
      if (notiFilter === "yes" && !canReceive) return false;
      if (notiFilter === "no" && canReceive) return false;
    }
    return true;
  });

  renderAccountsTable(filtered);
}

function resetFilters() {
  document.getElementById("search-input").value = "";
  document.getElementById("filter-role").value = "";
  document.getElementById("filter-department").value = "";
  document.getElementById("filter-notification").value = "";
  applyFilters();
}

// ===== Render bảng (theo danh sách đã lọc) =====
function renderAccountsTable(list) {
  const tbody = document.getElementById("accounts-table-body");

  if (list.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="8" style="text-align:center;padding:40px;color:var(--gray-400);">
          <i class="fas fa-inbox" style="font-size:24px;display:block;margin-bottom:8px;"></i>
          Không tìm thấy tài khoản nào phù hợp
        </td>
      </tr>
    `;
    updateSelectAllState([]);
    updateBulkBar();
    return;
  }

  const roleBadge = {
    superadmin: 'badge-superadmin',
    admin: 'badge-admin',
    member: 'badge-member'
  };

  tbody.innerHTML = "";
  list.forEach(data => {
    const tr = document.createElement("tr");

    // Kiểm tra có được nhận thông báo không
    const canReceiveNotification = data.canReceiveNotification !== false; // default true
    const isChecked = selectedIds.has(data.id);

    tr.innerHTML = `
      <td><input type="checkbox" class="row-checkbox" data-id="${data.id}" ${isChecked ? 'checked' : ''} onchange="toggleSelectRow('${data.id}', this.checked)"></td>
      <td><strong>${data.id}</strong></td>
      <td>${data.email}</td>
      <td><span class="badge ${roleBadge[data.role] || 'badge-member'}">${data.role}</span></td>
      <td>${data.department || '—'}</td>
      <td>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" 
                 class="notification-toggle" 
                 data-id="${data.id}"
                 ${canReceiveNotification ? 'checked' : ''}
                 onchange="toggleNotification('${data.id}', this.checked)">
          <span style="font-size:12px;color:var(--gray-500);">
            ${canReceiveNotification ? 'Có' : 'Không'}
          </span>
        </label>
      </td>
      <td>${data.note || '—'}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="editAccount('${data.id}')" title="Sửa">
          <i class="fas fa-edit"></i>
        </button>
        <button class="btn btn-danger btn-sm" onclick="deleteAccount('${data.id}')" title="Xóa">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateSelectAllState(list);
  updateBulkBar();
}

// ===== Chọn nhiều =====
function toggleSelectRow(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);

  const idsOnScreen = Array.from(document.querySelectorAll('.row-checkbox')).map(cb => ({ id: cb.dataset.id }));
  updateSelectAllState(idsOnScreen);
  updateBulkBar();
}

function toggleSelectAll(checked) {
  const checkboxes = document.querySelectorAll('.row-checkbox');
  checkboxes.forEach(cb => {
    cb.checked = checked;
    if (checked) selectedIds.add(cb.dataset.id);
    else selectedIds.delete(cb.dataset.id);
  });
  updateBulkBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = false);
  const selectAll = document.getElementById("select-all-checkbox");
  if (selectAll) { selectAll.checked = false; selectAll.indeterminate = false; }
  updateBulkBar();
}

function updateSelectAllState(list) {
  const selectAll = document.getElementById("select-all-checkbox");
  if (!selectAll) return;
  const idsOnScreen = list.map(item => item.id);
  const allChecked = idsOnScreen.length > 0 && idsOnScreen.every(id => selectedIds.has(id));
  const anyChecked = idsOnScreen.some(id => selectedIds.has(id));
  selectAll.checked = allChecked;
  selectAll.indeterminate = !allChecked && anyChecked;
}

function updateBulkBar() {
  const bar = document.getElementById("bulk-bar");
  const countEl = document.getElementById("bulk-count");
  if (!bar || !countEl) return;
  if (selectedIds.size > 0) {
    bar.style.display = "flex";
    countEl.textContent = `${selectedIds.size} đã chọn`;
  } else {
    bar.style.display = "none";
  }
}

async function bulkDeleteAccounts() {
  if (selectedIds.size === 0) return;
  if (!(await confirmDialog(`Bạn có chắc muốn xóa ${selectedIds.size} tài khoản đã chọn?`))) return;

  try {
    await Promise.all(Array.from(selectedIds).map(id => db.collection("account").doc(id).delete()));
  } catch (err) {
    console.error("Lỗi khi xóa hàng loạt:", err);
    showToast("Không thể xóa một số tài khoản!", "error");
  } finally {
    selectedIds.clear();
    loadAccounts();
  }
}

// ===== Bulk: đổi role =====
async function bulkChangeRole() {
  const role = document.getElementById("bulk-role-select").value;
  if (!role) { showToast("Vui lòng chọn role muốn áp dụng!", "warning"); return; }
  if (selectedIds.size === 0) return;
  if (!(await confirmDialog(`Đổi role thành "${role}" cho ${selectedIds.size} tài khoản đã chọn?`, { danger: false }))) return;

  try {
    const batch = db.batch();
    selectedIds.forEach(id => batch.update(db.collection("account").doc(id), { role }));
    await batch.commit();
    selectedIds.forEach(id => {
      const acc = allAccounts.find(a => a.id === id);
      if (acc) acc.role = role;
    });
    document.getElementById("bulk-role-select").value = "";
    applyFilters();
  } catch (err) {
    console.error("Lỗi đổi role hàng loạt:", err);
    showToast("Không thể đổi role cho một số tài khoản!", "error");
    loadAccounts();
  }
}

// ===== Bulk: đổi ban =====
async function bulkChangeDepartment() {
  const department = document.getElementById("bulk-department-select").value;
  if (!department) { showToast("Vui lòng chọn ban muốn áp dụng!", "warning"); return; }
  if (selectedIds.size === 0) return;
  if (!(await confirmDialog(`Đổi ban thành "${department}" cho ${selectedIds.size} tài khoản đã chọn?`, { danger: false }))) return;

  try {
    const batch = db.batch();
    selectedIds.forEach(id => batch.update(db.collection("account").doc(id), { department }));
    await batch.commit();
    selectedIds.forEach(id => {
      const acc = allAccounts.find(a => a.id === id);
      if (acc) acc.department = department;
    });
    document.getElementById("bulk-department-select").value = "";
    applyFilters();
  } catch (err) {
    console.error("Lỗi đổi ban hàng loạt:", err);
    showToast("Không thể đổi ban cho một số tài khoản!", "error");
    loadAccounts();
  }
}

// ===== Bulk: bật/tắt thông báo =====
async function bulkToggleNotification(enabled) {
  if (selectedIds.size === 0) return;
  if (!(await confirmDialog(`${enabled ? 'Bật' : 'Tắt'} thông báo cho ${selectedIds.size} tài khoản đã chọn?`, { danger: false }))) return;

  try {
    const batch = db.batch();
    selectedIds.forEach(id => batch.update(db.collection("account").doc(id), { canReceiveNotification: enabled }));
    await batch.commit();
    selectedIds.forEach(id => {
      const acc = allAccounts.find(a => a.id === id);
      if (acc) acc.canReceiveNotification = enabled;
    });
    applyFilters();
  } catch (err) {
    console.error("Lỗi cập nhật thông báo hàng loạt:", err);
    showToast("Không thể cập nhật thông báo cho một số tài khoản!", "error");
    loadAccounts();
  }
}

// ===== Toggle nhận thông báo =====
async function toggleNotification(id, checked) {
  try {
    await db.collection("account").doc(id).update({
      canReceiveNotification: checked
    });

    // Cập nhật dữ liệu trong bộ nhớ để bộ lọc luôn đúng
    const acc = allAccounts.find(a => a.id === id);
    if (acc) acc.canReceiveNotification = checked;

    // Cập nhật label
    const row = document.querySelector(`input.notification-toggle[data-id="${id}"]`).closest('tr');
    const label = row.querySelector('label span');
    label.textContent = checked ? 'Có' : 'Không';
    
    console.log(`✅ Đã cập nhật nhận thông báo cho ${id}: ${checked}`);
  } catch (err) {
    console.error("Lỗi cập nhật nhận thông báo:", err);
    showToast("Không thể cập nhật trạng thái nhận thông báo!", "error");
    // Revert checkbox
    const checkbox = document.querySelector(`input.notification-toggle[data-id="${id}"]`);
    checkbox.checked = !checked;
  }
}

// ===== Form =====
function showAddAccountForm() {
  document.getElementById("account-form").reset();
  document.getElementById("account-id").value = "";
  document.getElementById("account-name").disabled = false;
  document.getElementById("account-email").disabled = false;
  document.getElementById("form-modal-title").textContent = "Thêm tài khoản mới";
  document.getElementById("account-form-modal").classList.add("active");
}

function closeForm() {
  document.getElementById("account-form-modal").classList.remove("active");
}

// ===== Save (thêm/sửa) =====
document.getElementById("account-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const emailInput = document.getElementById("account-email").value.trim().toLowerCase();
  const id = document.getElementById("account-id").value || emailInput;

  if (!id) {
    showToast("Email tài khoản không được để trống!", "warning");
    return;
  }

  const data = {
    fullname: document.getElementById("account-name").value.trim(),
    email: emailInput,
    role: document.getElementById("account-role").value,
    department: document.getElementById("account-department").value,
    note: document.getElementById("account-note").value.trim(),
    canReceiveNotification: document.getElementById("account-notification").checked
  };

  try {
    await db.collection("account").doc(id).set(data, { merge: true });
    closeForm();
    loadAccounts();
  } catch (err) {
    console.error("Lỗi khi lưu account:", err);
    showToast("Không thể lưu tài khoản!", "error");
  }
});

// ===== Edit =====
async function editAccount(id) {
  try {
    const docSnap = await db.collection("account").doc(id).get();
    if (!docSnap.exists) return;

    const data = docSnap.data();
    document.getElementById("account-id").value = id;
    document.getElementById("account-name").value = data.fullname || "";
    document.getElementById("account-name").disabled = false;
    document.getElementById("account-email").value = data.email;
    document.getElementById("account-email").disabled = true; // email giờ là ID, không cho đổi khi sửa
    document.getElementById("account-role").value = data.role;
    document.getElementById("account-department").value = data.department || "";
    document.getElementById("account-note").value = data.note || "";
    document.getElementById("account-notification").checked = data.canReceiveNotification !== false;
    document.getElementById("form-modal-title").textContent = "Chỉnh sửa tài khoản";

    document.getElementById("account-form-modal").classList.add("active");
  } catch (err) {
    console.error("Lỗi khi edit account:", err);
  }
}

// ===== Delete =====
async function deleteAccount(id) {
  if (!(await confirmDialog("Bạn có chắc muốn xóa tài khoản này?"))) return;
  try {
    await db.collection("account").doc(id).delete();
    loadAccounts();
  } catch (err) {
    console.error("Lỗi khi xóa account:", err);
    showToast("Không thể xóa tài khoản!", "error");
  }
}

// ===== Logout =====
async function logout() {
  if (!(await confirmDialog("Bạn có chắc muốn đăng xuất?", { danger: false }))) return;
  auth.signOut().then(() => {
    sessionStorage.clear();
    window.location.href = "login.html";
  });
}

// ===== Kiểm tra quyền =====
auth.onAuthStateChanged(user => {
  if (!user) {
    sessionStorage.setItem("postLoginRedirect", location.pathname + location.search);
    window.location.href = "login.html";
    return;
  }
  const role = sessionStorage.getItem("role");
  if (role !== "superadmin") {
    showToast("Bạn không có quyền truy cập trang này!", "error");
    window.location.href = "dashboard.html";
    return;
  }
  loadAccounts();
});

// Click outside modal to close
document.getElementById("account-form-modal").addEventListener("click", function(e) {
  if (e.target === this) closeForm();
});
</script>
</body>
